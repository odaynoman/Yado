name: Release

# Builds native installers for Windows and macOS on every version tag
# (git tag v0.2.2 && git push origin v0.2.2) and attaches them to a
# GitHub Release for easy sharing.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            # Universal binary: runs on Apple Silicon and Intel Macs.
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Yado Notch ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform. Windows: -setup.exe — macOS: .dmg (right-click → Open on first launch, the app is unsigned)."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}